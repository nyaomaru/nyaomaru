name: Update DEV followers badge

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Bare `22` selects the runner toolcache, which lags security
          # releases. Stay on 22.x at or above the November 2026 patch.
          node-version: ">=22.23.5 <23"
          check-latest: true

      - name: Generate follower badge
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node scripts/update-dev-followers.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/dev-followers.svg README.md; then
            echo "No follower count change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dev-followers.svg README.md
          git commit -m "chore: update DEV follower badge"

          # A valid push can be rejected with "remote: Internal Server Error"
          # while GitHub Git Operations are degraded. The commit stays local
          # until the ref update is accepted, so retry that error only.
          max_attempts=6
          delay=10
          for attempt in $(seq 1 "$max_attempts"); do
            if output=$(git push origin main 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
              printf '%s\n' "$output"
              if ! printf '%s\n' "$output" | grep -q "Internal Server Error"; then
                echo "git push failed with a non-retryable error."
                exit "$status"
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "git push failed after ${attempt} attempts."
                exit "$status"
              fi
              echo "GitHub returned Internal Server Error (attempt ${attempt}/${max_attempts}). Retrying in ${delay}s."
              sleep "$delay"
              delay=$((delay * 2))
              if [ "$delay" -gt 90 ]; then
                delay=90
              fi
            fi
          done
